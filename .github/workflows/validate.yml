name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mockworld-mcp
      - name: Validate mocks + verify checksums
        run: python scripts/check.py
      - name: E2E scenario checks (mock behavior, not just schema)
        run: python scripts/e2e.py
