schema_version: "1"
name: slack
version: "0.1.0"
description: >
  Fake Slack. Post messages, list channels, read history, and add reactions with
  realistic channel membership, threading, and Slack-shaped {ok:false, error} bodies.
fidelity: partial

state:
  channels:
    key: id
    fields: {id: str, name: str, is_member: bool, is_private: bool}
  messages:
    key: ts
    fields: {ts: str, channel: str, user: str, text: str, thread_ts: str, reactions: dict}

seed:
  generator: python:seed.generate
  volume: {channels: 8, messages: 40}

tools:
  - name: list_channels
    description: "List channels, including whether the caller is a member of each."
    params: {}
    behavior: python:handlers.list_channels

  - name: post_message
    description: >
      Post a message to a channel. You must be a member of the channel. `text` is
      capped at 4000 characters. Pass `thread_ts` to reply in a thread. Returns the
      posted message with its `ts` (timestamp id).
    params:
      channel: {type: str, required: true}
      text: {type: str, required: true}
      thread_ts: {type: str, required: false}
    behavior: python:handlers.post_message
    faults:
      - type: rate_limited
        probability: 0.03
        retry_after_s: 1

  - name: get_channel_history
    description: "Return a channel's messages, newest first. `limit` defaults to 20."
    params:
      channel: {type: str, required: true}
      limit: {type: int, required: false, default: 20}
    behavior: python:handlers.get_channel_history

  - name: add_reaction
    description: "Add an emoji reaction (e.g. 'thumbsup') to a message by its timestamp."
    params:
      channel: {type: str, required: true}
      timestamp: {type: str, required: true}
      name: {type: str, required: true}
    behavior: python:handlers.add_reaction

errors:
  channel_not_found:
    http_status: 200
    body: {ok: false, error: channel_not_found}
  not_in_channel:
    http_status: 200
    body: {ok: false, error: not_in_channel}
  message_not_found:
    http_status: 200
    body: {ok: false, error: message_not_found}
  msg_too_long:
    http_status: 200
    body: {ok: false, error: msg_too_long}
  rate_limited:
    http_status: 429
    retry_after_s: 1
    body: {ok: false, error: rate_limited}

fault_profiles:
  none: {}
  realistic: {inherit: tool_defaults}
  hostile:
    inherit: tool_defaults
    overrides:
      post_message: {rate_limited: 0.25}
